<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Compartilhar tela</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; display: flex; flex-direction: column;
        background: #09090a; color: #fafafa;
        font-family: system-ui, "Segoe UI", sans-serif;
      }
      header { padding: 16px 18px 8px; }
      h1 { margin: 0; font-size: 16px; font-weight: 600; }
      p { margin: 4px 0 0; font-size: 13px; color: #ababab; }
      .abas { display: flex; gap: 6px; padding: 10px 18px 0; }
      .aba {
        border: 0; border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px;
        background: rgb(255 255 255 / 0.05); color: #ababab; cursor: pointer;
      }
      .aba[aria-selected="true"] { background: rgb(255 255 255 / 0.14); color: #fafafa; }
      main {
        flex: 1; overflow: auto; padding: 14px 18px;
        display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; align-content: start;
      }
      .item {
        border: 1px solid rgb(255 255 255 / 0.08); border-radius: 12px; overflow: hidden;
        background: rgb(255 255 255 / 0.03); cursor: pointer; padding: 0; text-align: left;
        color: inherit; font: inherit; transition: border-color .15s, background .15s;
      }
      .item:hover, .item:focus-visible { border-color: rgb(255 255 255 / 0.5); background: rgb(255 255 255 / 0.07); outline: none; }
      .item img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #000; }
      .item span { display: block; padding: 8px 10px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid rgb(255 255 255 / 0.06); }
      .dica { font-size: 12px; color: #8b8b8b; }
      .cancelar { border: 0; border-radius: 10px; padding: 9px 16px; font: inherit; font-weight: 600; background: rgb(255 255 255 / 0.08); color: #fafafa; cursor: pointer; }
      .cancelar:hover { background: rgb(255 255 255 / 0.14); }
    </style>
  </head>
  <body>
    <header>
      <h1>O que você quer compartilhar?</h1>
      <p>O som do computador vai junto. Dá pra desligar o som na barra da chamada.</p>
    </header>
    <div class="abas">
      <button class="aba" id="aba-telas" aria-selected="true">Telas</button>
      <button class="aba" id="aba-janelas" aria-selected="false">Janelas</button>
    </div>
    <main id="lista"></main>
    <footer>
      <span class="dica">Dica: pra filme, escolha a tela ou a janela do player.</span>
      <button class="cancelar" id="cancelar">Cancelar</button>
    </footer>
    <script src="picker.js"></script>
  </body>
</html>
